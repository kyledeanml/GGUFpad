<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Yoga Pad Surface Gradient -->
    <linearGradient id="padSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f2038" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Yoga Pad Roll Gradient -->
    <linearGradient id="padRoll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a5285" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12243d" stop-opacity="0.8"/>
    </linearGradient>

    <!-- GPU Shroud Body Gradient -->
    <linearGradient id="gpuShroud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242c3d"/>
      <stop offset="50%" stop-color="#151b27"/>
      <stop offset="100%" stop-color="#0b1019"/>
    </linearGradient>

    <!-- GPU Metallic Bevel / Backplate -->
    <linearGradient id="gpuMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <!-- Neon Blue Glowing Edge Gradient -->
    <linearGradient id="neonBlueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Cyan Circuit / Data Flow Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Fan Blade Center Gradient -->
    <radialGradient id="fanHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="70%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="gpuLevitateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ==================== 1. PERSPECTIVE YOGA PAD (PYTHONPANEL STYLE) ==================== -->
  <g transform="translate(26, 75) scale(1.28)">
    <!-- Floor Shadow beneath the pad -->
    <path d="M 48 258 L 288 258 L 328 214 L 92 214 Z"
          fill="#040812" fill-opacity="0.6"/>

    <!-- Pad Thickness / Edge -->
    <path d="M 44 248 L 282 248 L 322 204 L 322 211 L 282 255 L 44 255 Z"
          fill="#132742" fill-opacity="0.85"
          stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.45" stroke-linejoin="round"/>

    <!-- Pad Main Top Surface -->
    <path d="M 44 248 L 282 248 L 322 204 L 88 204 Z"
          fill="url(#padSurface)"
          stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.55" stroke-linejoin="round"/>

    <!-- Non-slip Grid & Center Alignment Lines -->
    <line x1="70" y1="226" x2="298" y2="226"
          stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.38" stroke-dasharray="6,5"/>
    <line x1="176" y1="207" x2="152" y2="245"
          stroke="#38bdf8" stroke-width="1.0" stroke-opacity="0.35"/>

    <!-- Rolled End on the Left -->
    <path d="M 38 236 C 34 236 31 240 31 245 C 31 250 34 254 38 254 L 82 208 C 78 208 75 204 75 199 C 75 194 78 190 82 190 Z"
          fill="url(#padRoll)"
          stroke="#00f0ff" stroke-width="1.3" stroke-opacity="0.55"/>

    <!-- Rolled Cylinder End-Cap -->
    <ellipse cx="40" cy="245" rx="7.5" ry="9.5"
             fill="#0c1829" fill-opacity="0.85"
             stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.6"/>
    <path d="M 40 241 C 42 241 43 243 43 245 C 43 247 41 249 39 249 C 37 249 36 246 37 244"
          fill="none" stroke="#00f0ff" stroke-width="1.1" stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- Floating Shadow of the Levitating GPU cast onto the Pad -->
    <ellipse cx="186" cy="225" rx="78" ry="16"
             fill="#030811" fill-opacity="0.75" filter="url(#gpuLevitateGlow)"/>

    <!-- Neon Energy Rings / Levitation aura onto pad surface -->
    <ellipse cx="186" cy="225" rx="68" ry="13"
             fill="none" stroke="url(#cyanNeon)" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="4,4"/>
  </g>

  <!-- ==================== 2. FLOATING / LEVITATING GPU GRAPHICS CARD ==================== -->
  <g transform="translate(106, 68)">
    <!-- Cyan Energy Rays / Levitation Particles below GPU -->
    <line x1="80" y1="230" x2="65" y2="280" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3,3"/>
    <line x1="150" y1="236" x2="150" y2="295" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3,3"/>
    <line x1="220" y1="230" x2="235" y2="280" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3,3"/>

    <!-- GPU PCIe Gold Connector Bracket (Bottom Edge) -->
    <rect x="70" y="222" width="160" height="10" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1"/>
    <!-- PCIe Finger Pins -->
    <path d="M 75 224 L 75 230 M 80 224 L 80 230 M 85 224 L 85 230 M 90 224 L 90 230 M 95 224 L 95 230 M 100 224 L 100 230 M 105 224 L 105 230 M 110 224 L 110 230 M 115 224 L 115 230 M 120 224 L 120 230 M 125 224 L 125 230 M 130 224 L 130 230 M 145 224 L 145 230 M 150 224 L 150 230 M 155 224 L 155 230 M 160 224 L 160 230 M 165 224 L 165 230 M 170 224 L 170 230 M 175 224 L 175 230 M 180 224 L 180 230 M 185 224 L 185 230 M 190 224 L 190 230 M 195 224 L 195 230 M 200 224 L 200 230 M 205 224 L 205 230 M 210 224 L 210 230 M 215 224 L 215 230 M 220 224 L 220 230"
          stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- GPU Rear Metal DisplayPort / HDMI Bracket (Left Side) -->
    <path d="M 28 65 L 42 60 L 42 225 L 28 220 Z"
          fill="url(#gpuMetal)" stroke="#64748b" stroke-width="1.2"/>
    <rect x="31" y="85" width="8" height="18" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
    <rect x="31" y="115" width="8" height="18" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
    <rect x="31" y="145" width="8" height="18" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>

    <!-- GPU Main Shroud Body (Sleek Angular Graphics Card) -->
    <path d="M 42 60 L 260 60 L 274 74 L 274 212 L 260 224 L 42 224 Z"
          fill="url(#gpuShroud)"
          stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8"
          filter="url(#gpuLevitateGlow)"/>

    <!-- Backplate Bevel & Geometric Details -->
    <path d="M 48 68 L 254 68 L 266 80 L 266 206 L 254 216 L 48 216 Z"
          fill="#111827" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Sleek Neon Blue Light Bar along the top (Clean & Unbranded) -->
    <path d="M 52 74 L 250 74 L 258 82 L 258 86 L 52 86 Z"
          fill="url(#neonBlueGlow)" filter="url(#gpuLevitateGlow)"/>
    <line x1="56" y1="80" x2="246" y2="80" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>

    <!-- ==================== DUAL COOLING FANS ==================== -->
    <!-- FAN 1 (Left) -->
    <g transform="translate(102, 146)">
      <!-- Fan Circular Inset Ring -->
      <circle cx="0" cy="0" r="44" fill="#0a0f1d" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="41" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6"/>

      <!-- Fan Blades (Curved Aerodynamic) -->
      <path d="M 0 -14 C 10 -28 24 -36 34 -34 C 36 -28 30 -18 14 -10 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M 12 -6 C 28 -4 40 6 42 16 C 36 20 26 16 12 8 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M 10 10 C 22 22 26 36 20 44 C 14 42 8 32 4 14 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M -4 14 C -12 28 -24 36 -34 34 C -36 28 -30 18 -14 10 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M -12 6 C -28 4 -40 -6 -42 -16 C -36 -20 -26 -16 -12 -8 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M -10 -10 C -22 -22 -26 -36 -20 -44 C -14 -42 -8 -32 -4 -14 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>

      <!-- Center Hub with Glowing Core -->
      <circle cx="0" cy="0" r="15" fill="url(#fanHub)" stroke="#475569" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="6" fill="#00f0ff" opacity="0.9" filter="url(#gpuLevitateGlow)"/>
    </g>

    <!-- FAN 2 (Right) -->
    <g transform="translate(206, 146)">
      <!-- Fan Circular Inset Ring -->
      <circle cx="0" cy="0" r="44" fill="#0a0f1d" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="41" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6"/>

      <!-- Fan Blades -->
      <path d="M 0 -14 C 10 -28 24 -36 34 -34 C 36 -28 30 -18 14 -10 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M 12 -6 C 28 -4 40 6 42 16 C 36 20 26 16 12 8 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M 10 10 C 22 22 26 36 20 44 C 14 42 8 32 4 14 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M -4 14 C -12 28 -24 36 -34 34 C -36 28 -30 18 -14 10 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M -12 6 C -28 4 -40 -6 -42 -16 C -36 -20 -26 -16 -12 -8 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <path d="M -10 -10 C -22 -22 -26 -36 -20 -44 C -14 -42 -8 -32 -4 -14 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>

      <!-- Center Hub with Glowing Core -->
      <circle cx="0" cy="0" r="15" fill="url(#fanHub)" stroke="#475569" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="6" fill="#00f0ff" opacity="0.9" filter="url(#gpuLevitateGlow)"/>
    </g>

    <!-- Center Badge: GGUF Neural Chip -->
    <g transform="translate(154, 134)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8"
               fill="#0d1726" stroke="url(#cyanNeon)" stroke-width="1.8"/>
      <text x="0" y="4" font-family="monospace, sans-serif" font-weight="900" font-size="8" fill="#00f0ff" text-anchor="middle">GGUF</text>
    </g>

    <!-- Heatpipes / Geometric Accents on the right -->
    <path d="M 256 100 L 268 100 M 256 120 L 268 120 M 256 170 L 268 170 M 256 190 L 268 190"
          stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
