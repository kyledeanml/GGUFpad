<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="50%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6b11ff"/>
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#99e31b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="#2b384e" stroke-width="2"/>

  <!-- Neural Mesh / Circuit lines -->
  <path d="M 28 44 L 54 44 L 64 64 L 100 64" stroke="#253549" stroke-width="2" fill="none"/>
  <path d="M 28 84 L 54 84 L 64 64" stroke="#253549" stroke-width="2" fill="none"/>
  <path d="M 64 24 L 64 104" stroke="#253549" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <!-- GGUF Hexagon / Silicon Core -->
  <polygon points="64,34 88,48 88,76 64,90 40,76 40,48" fill="#162233" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Center Brain / AI Nodes -->
  <circle cx="64" cy="52" r="4" fill="#00f2fe"/>
  <circle cx="52" cy="68" r="3.5" fill="#4facfe"/>
  <circle cx="76" cy="68" r="3.5" fill="#6b11ff"/>
  <circle cx="64" cy="74" r="3" fill="#76b900"/>

  <line x1="64" y1="52" x2="52" y2="68" stroke="#00f2fe" stroke-width="1.5"/>
  <line x1="64" y1="52" x2="76" y2="68" stroke="#4facfe" stroke-width="1.5"/>
  <line x1="52" y1="68" x2="64" y2="74" stroke="#76b900" stroke-width="1.5"/>
  <line x1="76" y1="68" x2="64" y2="74" stroke="#76b900" stroke-width="1.5"/>

  <!-- Text / Badge: GGUF -->
  <rect x="36" y="96" width="56" height="18" rx="6" fill="#1b2a3a" stroke="#2b3e55" stroke-width="1"/>
  <text x="64" y="109" font-family="monospace, sans-serif" font-weight="900" font-size="11" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="1.5">GGUF</text>

  <!-- NVIDIA Green Acceleration Indicator -->
  <circle cx="98" cy="28" r="5" fill="url(#gpuGrad)" filter="url(#glow)"/>
</svg>
